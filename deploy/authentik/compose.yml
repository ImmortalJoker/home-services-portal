services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - database:/var/lib/postgresql/data

  portal-test:
    build:
      context: ../..
      dockerfile: deploy/authentik/portal/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    environment:
      NODE_ENV: production
      PORTAL_CONFIG_PATH: /app/config/portal-services.json
      PORTAL_DIST_DIR: /app/dist
      PORTAL_BIND_HOST: portal-backend
      PORTAL_TRUSTED_PROXY_HOST: portal-auth-proxy
      PORTAL_STATUS_UPSTREAM_URL: ${PORTAL_STATUS_UPSTREAM_URL:-}
      PORTAL_STATUS_EXTERNAL_URL: ${PORTAL_METRICS_EXTERNAL_HOST:-}
      PORTAL_TRANSMISSION_RPC_USERNAME: ${PORTAL_TRANSMISSION_RPC_USERNAME:-}
      PORTAL_TRANSMISSION_RPC_PASSWORD: ${PORTAL_TRANSMISSION_RPC_PASSWORD:-}
      PORT: "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    networks:
      portal_private:
        aliases:
          - portal-backend
      portal_egress: {}
    volumes:
      - ${PORTAL_CONFIG_FILE:-./portal-services.json.example}:/app/config/portal-services.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://portal-backend:8080/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: server
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
    shm_size: 512mb
    networks:
      default: {}
      portal_private:
        aliases:
          - portal-auth-proxy
    volumes:
      - ./data:/data
      - ./custom-templates:/templates

  worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: worker
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      PORTAL_TEST_EXTERNAL_HOST: ${PORTAL_TEST_EXTERNAL_HOST:-}
      PORTAL_BOOKS_EXTERNAL_HOST: ${PORTAL_BOOKS_EXTERNAL_HOST:-}
      PORTAL_AUDIOBOOKSHELF_EXTERNAL_HOST: ${PORTAL_AUDIOBOOKSHELF_EXTERNAL_HOST:-}
      PORTAL_AUDIOBOOKSHELF_OIDC_CLIENT_SECRET: ${PORTAL_AUDIOBOOKSHELF_OIDC_CLIENT_SECRET:-}
      PORTAL_AUDIOBOOKSHELF_OIDC_WEB_CALLBACK_URL: ${PORTAL_AUDIOBOOKSHELF_OIDC_WEB_CALLBACK_URL:-}
      PORTAL_AUDIOBOOKSHELF_OIDC_GATEWAY_CALLBACK_URL: ${PORTAL_AUDIOBOOKSHELF_OIDC_GATEWAY_CALLBACK_URL:-}
      PORTAL_AUDIOBOOKSHELF_OIDC_MOBILE_CALLBACK_URL: ${PORTAL_AUDIOBOOKSHELF_OIDC_MOBILE_CALLBACK_URL:-}
      PORTAL_AUDIOBOOKSHELF_OIDC_LOGOUT_CALLBACK_URL: ${PORTAL_AUDIOBOOKSHELF_OIDC_LOGOUT_CALLBACK_URL:-}
      PORTAL_METRICS_EXTERNAL_HOST: ${PORTAL_METRICS_EXTERNAL_HOST:-}
      PORTAL_TRANSMISSION_EXTERNAL_HOST: ${PORTAL_TRANSMISSION_EXTERNAL_HOST:-}
      PORTAL_TRANSMISSION_RPC_USERNAME: ${PORTAL_TRANSMISSION_RPC_USERNAME:-}
      PORTAL_TRANSMISSION_RPC_PASSWORD: ${PORTAL_TRANSMISSION_RPC_PASSWORD:-}
      PORTAL_GROCY_EXTERNAL_HOST: ${PORTAL_GROCY_EXTERNAL_HOST:-}
      PORTAL_GROCY_INTERNAL_HOST: ${PORTAL_GROCY_INTERNAL_HOST:-http://grocy:80}
      # Grocy API skip is disabled in the blueprint; no environment opt-in.
      PORTAL_IMMICH_OIDC_CLIENT_SECRET: ${PORTAL_IMMICH_OIDC_CLIENT_SECRET:-}
      PORTAL_IMMICH_OIDC_WEB_LOGIN_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_WEB_LOGIN_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_WEB_LINK_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_WEB_LINK_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_LAN_LOGIN_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_LAN_LOGIN_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_LAN_LINK_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_LAN_LINK_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_TAILNET_LOGIN_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_TAILNET_LOGIN_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_TAILNET_LINK_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_TAILNET_LINK_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_HTTPS_LOGIN_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_HTTPS_LOGIN_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_HTTPS_LINK_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_HTTPS_LINK_CALLBACK_URL:-}
      PORTAL_IMMICH_OIDC_MOBILE_CALLBACK_URL: ${PORTAL_IMMICH_OIDC_MOBILE_CALLBACK_URL:-}
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints/portal-access-groups.yaml:/blueprints/portal-access-groups.yaml:ro

networks:
  portal_private:
    internal: true
  # Outbound-only membership: no other service joins, and the app does not bind this interface.
  portal_egress: {}

volumes:
  database:
    driver: local
