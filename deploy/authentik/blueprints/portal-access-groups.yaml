version: 1
metadata:
  name: Home Services Portal access groups
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    identifiers:
      name: Portal - Public
    attrs:
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: Portal - Family
    attrs:
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: Portal - Owner
    attrs:
      is_superuser: false
  - model: authentik_providers_proxy.proxyprovider
    id: portal-test-provider
    conditions:
      - !Env PORTAL_TEST_EXTERNAL_HOST
    identifiers:
      name: Portal Test Protected Service Provider
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      internal_host: http://portal-test:8080
      external_host: !Env PORTAL_TEST_EXTERNAL_HOST
      internal_host_ssl_validation: false
      mode: proxy
      skip_path_regex: ""
      basic_auth_enabled: false
      intercept_header_auth: false
      cookie_domain: ""
  - model: authentik_core.application
    id: portal-test-application
    conditions:
      - !Env PORTAL_TEST_EXTERNAL_HOST
    identifiers:
      slug: portal-test
    attrs:
      name: Portal Test Protected Service
      provider: !KeyOf portal-test-provider
      meta_launch_url: !Env PORTAL_TEST_EXTERNAL_HOST
      meta_description: Test-only service used to verify Authentik authentication and group authorization.
      policy_engine_mode: any
      open_in_new_tab: true
      meta_hide: false
  - model: authentik_outposts.outpost
    id: portal-test-outpost
    conditions:
      - !Env PORTAL_TEST_EXTERNAL_HOST
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf portal-test-provider
  - model: authentik_policies.policybinding
    conditions:
      - !Env PORTAL_TEST_EXTERNAL_HOST
    identifiers:
      order: 0
      target: !KeyOf portal-test-application
    attrs:
      group: !Find [authentik_core.group, [name, Portal - Owner]]
      enabled: true
      negate: false
      timeout: 30
      failure_result: false
