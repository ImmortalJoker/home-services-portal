name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - name: Install Caddy for isolated Grocy proxy regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
          sudo systemctl stop caddy
      - run: npm run test:grocy-proxy-config
      - run: npm run test:grocy-proxy
      - run: npm test
      - name: Verify authenticated portal bundle
        env:
          VITE_BASE_PATH: /
          VITE_PORTAL_PUBLIC_DEMO: 'false'
        run: npm run build
      - run: npm run test:portal-server
      - name: Verify Authentik Compose security boundaries
        run: npm run test:authentik-compose
      - name: Verify Authentik runtime harness without starting an identity stack
        run: npm run test:authentik-verifier
      - name: Verify portal proxy peer isolation with disposable containers
        run: npm run test:portal-network
      - name: Build public Pages demo
        env:
          VITE_PORTAL_PUBLIC_DEMO: 'true'
        run: npm run build
      - name: Verify GitHub Pages asset paths
        run: node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');if(!html.includes('/home-services-portal/assets/'))throw new Error('Pages asset base path missing')"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
